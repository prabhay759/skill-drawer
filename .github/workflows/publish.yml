# Publishes to npm when a GitHub release is published (or on manual dispatch).
#
# Either add an NPM_TOKEN repository secret (automation token from npmjs.com),
# or enable npm "trusted publishing" for this repo/workflow on the package
# settings page; with trusted publishing the token is not needed and the
# id-token permission below is what authorises the publish.
name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
